<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock & Refer and Earn</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .container {
            width: 100%;
            max-width: 400px;
        }
        .card { 
            background: white; 
            border-radius: 12px; 
            padding: 25px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            margin-bottom: 20px; 
            text-align: center;
        }
        h3 { color: #333; margin-top: 0; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        .btn { 
            background: #0088cc; /* Telegram Blue */
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
            transition: 0.3s;
        }
        .btn:hover { background: #006699; }
        .btn-outline {
            background: transparent;
            color: #0088cc;
            border: 2px solid #0088cc;
        }
        .btn-outline:hover { background: #e6f2f8; }
        input[type="text"] { 
            padding: 12px; 
            width: 100%; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            text-align: center; 
            font-size: 14px;
            background: #f9f9f9;
        }
        .status-msg { font-size: 14px; font-weight: bold; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ================= UNLOCK PAGE SECTION ================= -->
        <div class="card">
            <h3>🔒 Unlock Content</h3>
            <p>Premium content ko unlock karne ke liye niche diye gaye Telegram App ko open karein.</p>
            <button class="btn" onclick="unlockTask()">Open Link & Unlock</button>
            <div id="unlockStatus" class="status-msg"></div>
        </div>

        <!-- ================= REFER & EARN SECTION ================= -->
        <div class="card">
            <h3>🎁 Refer & Earn</h3>
            <p>Apne dosto ko invite karein aur har referral par earn karein.</p>
            <input type="text" id="referLink" readonly>
            
            <button class="btn" onclick="copyLink()">📋 Copy Link</button>
            <button class="btn btn-outline" onclick="shareLink()">📤 Share Link</button>
        </div>

    </div>

    <script>
        // Aapka direct link jo aapne diya hai
        const directAppUrl = "https://t.me/jznurlshorts_bot/httpsurlshortsaimiotavercel";

        // Yahan par actual user ka ID aayega (aapke backend / database se)
        const currentUserId = "USER_12345"; 

        // Refer & Earn ke liye link Generate karna (Telegram Mini Apps mein startapp use hota hai tracking ke liye)
        const referralLink = `${directAppUrl}?startapp=ref_${currentUserId}`;

        // Input box mein link show karna
        document.getElementById('referLink').value = referralLink;

        // --- UNLOCK PAGE LOGIC ---
        function unlockTask() {
            // Link ko naye tab/window mein open karna
            window.open(directAppUrl, "_blank");
            
            const statusDiv = document.getElementById('unlockStatus');
            statusDiv.innerText = "⏳ Task verify ho raha hai... Please wait.";
            statusDiv.style.color = "orange";

            // 5 second baad automatically "Unlocked" show karne ka dummy logic (Aap ise apne hisaab se change kar sakte hain)
            setTimeout(() => {
                statusDiv.innerText = "✅ Successfully Unlocked!";
                statusDiv.style.color = "green";
                // Yahan aap next page pe redirect kar sakte hain:
                // window.location.href = "home.html";
            }, 5000);
        }

        // --- COPY LINK LOGIC ---
        function copyLink() {
            const linkInput = document.getElementById("referLink");
            linkInput.select();
            linkInput.setSelectionRange(0, 99999); // Mobile compatibility ke liye
            navigator.clipboard.writeText(linkInput.value).then(() => {
                alert("✅ Referral Link Copied Successfully!");
            }).catch(err => {
                console.error("Copy failed", err);
            });
        }

        // --- SHARE LINK LOGIC ---
        function shareLink() {
            if (navigator.share) {
                navigator.share({
                    title: 'Join & Earn Rewards!',
                    text: 'Mera link use karke app join karo aur rewards pao!',
                    url: referralLink
                }).catch((error) => console.log('Error sharing', error));
            } else {
                alert("Share feature aapke browser mein support nahi karta. Kripya link copy karein.");
            }
        }
    </script>
</body>
</html>
